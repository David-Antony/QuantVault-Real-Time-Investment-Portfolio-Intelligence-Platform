<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#060914">
    <title>QuantVault — 404 Not Found</title>
    <meta name="description" content="The page you are looking for does not exist on QuantVault.">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/theme.js"></script>
    <style>
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 3rem;
            position: relative;
            z-index: 10;
            background: radial-gradient(circle at center, rgba(0,0,0,0.5) 0%, transparent 70%);
        }
        .error-code {
            font-family: var(--font-display);
            font-size: 8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0;
            line-height: 1;
        }
        .error-message {
            font-size: var(--text-2xl);
            color: var(--text-primary);
            margin-bottom: 2rem;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
        .error-code {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="signup-page">
    <canvas id="bgCanvas"></canvas>
    <div class="error-container">
        <h1 class="error-code">404</h1>
        <p class="error-message">Oops! The market asset you are looking for cannot be found.</p>
        <a href="/" class="btn btn-primary" style="text-decoration: none;" data-tooltip="Go back to the main dashboard" aria-label="Return to Dashboard">Return to Dashboard</a>
    </div>
    <script src="/js/bg-pattern.js"></script>
</body>
</html>
